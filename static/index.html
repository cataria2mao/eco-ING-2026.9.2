<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生态调查 Agent</title>
<style>
  *{box-sizing:border-box}
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
    --shadow-md: 0 4px 12px rgba(0,0,0,.05);
    --shadow-lg: 0 20px 25px -5px rgba(0,0,0,.1), 0 10px 10px -5px rgba(0,0,0,.04);
  }

  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;margin:0;background:var(--bg-main);color:var(--text-main);height:100vh;overflow:hidden}

  /* 自定义全局滚动条 */
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25)}

  /* ================= 登录 / 注册 ================= */
  .auth-overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
                background:radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);backdrop-filter:blur(8px)}
  .auth-card{background:var(--bg-card);padding:36px 32px 28px;border-radius:var(--radius-lg);width:min(92vw,400px);
             box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.1)}
  .auth-card h2{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-0.02em}
  .auth-card p.sub{margin:0 0 24px;color:var(--text-muted);font-size:13px}
  .auth-card input{width:100%;padding:12px 14px;margin:8px 0;border:1px solid var(--border-color);border-radius:var(--radius-sm);font-size:14px;background:#fcfdff;transition:all .2s ease}
  .auth-card input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.15);background:#fff}
  .auth-card button.primary{width:100%;padding:12px;margin-top:16px;border:none;border-radius:var(--radius-sm);
             background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s ease;box-shadow:0 2px 4px rgba(37,99,235,.2)}
  .auth-card button.primary:hover{background:var(--primary-hover);transform:translateY(-1px)}
  .auth-card .switch{text-align:center;font-size:13px;color:var(--primary);margin-top:18px;cursor:pointer;user-select:none;font-weight:500}
  .auth-card .switch:hover{text-decoration:underline}
  .auth-err{color:#ef4444;font-size:13px;min-height:18px;margin-top:10px;text-align:center;font-weight:500}

  /* ================= 应用布局 ================= */
  #app{display:none;height:100vh}

  /* 侧边栏：浅色设计 */
  #sidebar{width:280px;flex:0 0 280px;background:#ffffff;color:var(--text-main);display:flex;flex-direction:column;height:100vh;border-right:1px solid var(--border-color)}
  .side-head{padding:16px 16px 12px}
  .brand{font-weight:700;font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;color:var(--text-main)}
  #new-chat{width:100%;padding:11px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;
            cursor:pointer;font-size:14px;font-weight:600;transition:all .2s ease;box-shadow:0 2px 6px rgba(37,99,235,.3)}
  #new-chat:hover{background:var(--primary-hover);transform:translateY(-1px)}
  .list-label{padding:10px 16px 6px;font-size:11px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;font-weight:600}
  #conv-list{flex:1;overflow-y:auto;padding:0 10px 10px}
  .conv{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;
        border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text-main);margin-bottom:4px;transition:all .15s ease}
  .conv:hover{background:#f1f5f9;color:var(--text-main)}
  .conv.active{background:#eff6ff;color:var(--primary);font-weight:600}
  .conv .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .conv .del{opacity:0;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:16px;
             line-height:1;padding:2px 4px;border-radius:4px;flex:0 0 auto;transition:all .15s}
  .conv .del:hover{background:#e2e8f0;color:#ef4444}
  .conv:hover .del{opacity:.8}
  .side-foot{padding:14px 16px;border-top:1px solid var(--border-color);display:flex;justify-content:space-between;
             align-items:center;gap:10px;font-size:13px;background:#fcfdff}
  .side-foot .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-main);font-weight:500}
  #logout{border:none;background:#f1f5f9;color:var(--text-muted);padding:6px 12px;border-radius:6px;cursor:pointer;flex:0 0 auto;font-size:12px;font-weight:500;transition:all .15s}
  #logout:hover{background:#fee2e2;color:#ef4444}

  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px;min-width:0;height:100vh;background:var(--bg-main)}

  /* 聊天主视窗：滚动条固定在卡片最右侧边缘 */
  #chat{
    flex:1;
    width:60%;
    background:var(--bg-card);
    border-radius:var(--radius-md);
    padding:20px;
    overflow-y: auto;
    overflow-x: hidden;
    box-shadow:var(--shadow-sm);
    border:1px solid var(--border-color);
    display:flex;
    flex-direction:column;
    gap:4px;
    position: relative;
  }

  .msg{margin:8px 0;padding:12px 16px;border-radius:var(--radius-md);max-width:82%;white-space:pre-wrap;
       word-wrap:break-word;line-height:1.6;font-size:14px;box-shadow:var(--shadow-sm);animation: fadeIn .2s ease}
  @keyframes fadeIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform: translateY(0); } }

  .user{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
  .assistant{background:#f1f5f9;color:var(--text-main);border-bottom-left-radius:4px}
  .system{background:#fef3c7;font-size:13px;color:#92400e;border:1px solid #fde68a}
  .tool{background:#e0f2fe;font-size:13px;color:#0369a1;border:1px solid #bae6fd}

  /* 错误气泡：固定高度，超长内容内部滚动 */
  .error{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fca5a5;
    max-height: 220px;
    overflow-y: auto;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    border-left: 4px solid #dc2626;
  }

  .msg.typing::after{content:"▍";margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .notice{margin:6px 0;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;line-height:1.6;
          background:#eff6ff;color:#1e40af;border-left:3px solid #3b82f6;box-shadow:var(--shadow-sm)}
  .notice .sub{opacity:.75;font-size:12px}
  .notice.route{background:#f5f3ff;color:#5b21b6;border-left-color:#8b5cf6}
  .notice.retrieve{background:#fffbeb;color:#b45309;border-left-color:#f59e0b}
  .notice.dispatch{background:#ecfdf5;color:#047857;border-left-color:#10b981}
  .notice.review{background:#fdf2f8;color:#9d174d;border-left-color:#ec4899}
  .notice .spinner{display:inline-block;width:12px;height:12px;margin-right:6px;
          border:2px solid rgba(245,158,11,.3);border-top-color:#f59e0b;border-radius:50%;
          vertical-align:-1px;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 表单与输入区 */
  #form{width:60%;display:flex;gap:10px;margin-top:16px;align-items:flex-end}

  /* 多行自动撑高输入框（隐藏滚动条） */
  #input{
    flex:1;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border-color);
    font-size:14px;
    background:#fff;
    resize:none;
    max-height:160px;
    min-height:46px;
    line-height:1.5;
    font-family:inherit;
    transition:all .2s ease;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #input::-webkit-scrollbar {
    display: none;
  }
  #input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.15)}

  #send{
    padding:0 20px;
    height:46px;
    border:none;
    border-radius:var(--radius-sm);
    background:var(--primary);
    color:#fff;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    transition:all .2s ease;
    box-shadow:0 2px 4px rgba(37,99,235,.2);
    flex-shrink:0;
  }
  #send:hover{background:var(--primary-hover);transform:translateY(-1px)}
  #send:disabled{background:#cbd5e1;cursor:not-allowed;transform:none;box-shadow:none}

  /* 人工确认面板：定高 + 滚动 + 深色代码风格 */
  .interrupt-panel{
    width:60%;
    background:#fffbeb;
    border:1px solid #fde68a;
    border-radius:var(--radius-md);
    padding:16px;
    margin-top:14px;
    box-shadow:var(--shadow-md);
    max-height: 280px;
    overflow-y: auto;
  }
  .interrupt-panel input[type="text"], .interrupt-panel select {
    padding:6px 10px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    margin:6px 4px 6px 0;
    font-size:13px;
    background:#fff;
  }
  .interrupt-panel input:focus, .interrupt-panel select:focus {
    outline:none;
    border-color:var(--primary);
  }
  .interrupt-panel button {
    padding:6px 14px;
    border:none;
    border-radius:6px;
    background:var(--primary);
    color:#fff;
    font-size:13px;
    cursor:pointer;
    font-weight:500;
    margin-right:6px;
    margin-top:6px;
    transition:background .15s;
  }
  .interrupt-panel button:hover { background:var(--primary-hover); }

  /* 面板内的错误块/结构化内容改为深色代码风格 */
  .interrupt-panel pre {
    background: #0f172a;
    color: #e2e8f0;
    padding: 12px;
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    max-height: 160px;
    overflow: auto;
    border: 1px solid rgba(255,255,255,.1);
    line-height: 1.5;
    margin: 8px 0;
  }

  #empty-tip{color:var(--text-muted);text-align:center;margin:auto;font-size:14px;font-weight:500}

  @media (max-width: 900px){
    #chat, #form, .interrupt-panel{width:100%}
    main{padding:12px}
  }
</style>
</head>
<body>

<!-- ================= 登录 / 注册 ================= -->
<div id="auth" class="auth-overlay" style="display:none">
  <form class="auth-card" id="auth-form">
    <h2 id="auth-title">登录</h2>
    <p class="sub" id="auth-sub">登录后即可保存你的对话记录</p>
    <input id="auth-user" placeholder="用户名" autocomplete="username" />
    <input id="auth-pass" type="password" placeholder="密码" autocomplete="current-password" />
    <button class="primary" type="submit" id="auth-submit">登录</button>
    <div class="auth-err" id="auth-err"></div>
    <div class="switch" id="auth-switch">没有账号？去注册</div>
  </form>
</div>

<!-- ================= 应用 ================= -->
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand">🌿 生态调查 Agent</div>
      <button id="new-chat">＋ 新对话</button>
    </div>
    <div class="list-label">对话历史</div>
    <div id="conv-list"></div>
    <div class="side-foot">
      <span class="who" id="user-name"></span>
      <button id="logout">退出</button>
    </div>
  </aside>

  <main>
    <div id="chat"><div id="empty-tip">开始你的第一个问题吧～</div></div>
    <div id="interrupt-panel" class="interrupt-panel" style="display:none"></div>
    <form id="form">
      <textarea id="input" placeholder="请输入你的问题..." rows="1" autocomplete="off" autofocus></textarea>
      <button type="submit" id="send">发送</button>
    </form>
  </main>
</div>

<script>
/* ============================================================
- 全局状态
- ============================================================ */

let token = localStorage.getItem("token") || "";
let currentUser = null;
let conversations = [];
let currentConv = null;
let ws = null;
let connectSeq = 0;

const authEl = document.getElementById("auth");
const authForm = document.getElementById("auth-form");
const authTitle = document.getElementById("auth-title");
const authSub = document.getElementById("auth-sub");
const authUser = document.getElementById("auth-user");
const authPass = document.getElementById("auth-pass");
const authSubmit = document.getElementById("auth-submit");
const authErr = document.getElementById("auth-err");
const authSwitch = document.getElementById("auth-switch");

const appEl = document.getElementById("app");
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const interruptPanel = document.getElementById("interrupt-panel");
const convList = document.getElementById("conv-list");
const userNameEl = document.getElementById("user-name");
const newChatBtn = document.getElementById("new-chat");
const logoutBtn = document.getElementById("logout");

/* 输入框随内容自动撑高与回车控制 */
input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = (this.scrollHeight) + 'px';
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

/* ============================================================
- HTTP 封装
- ============================================================ */

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const detail = data && (data.detail || data.message);
    throw new Error(typeof detail === "string" ? detail : ("请求失败 (" + res.status + ")"));
  }
  return data;
}

/* ============================================================
- 认证界面
- ============================================================ */

let authMode = "login";

function setAuthMode(mode) {
  authMode = mode;
  const login = mode === "login";
  authTitle.textContent = login ? "登录" : "注册";
  authSub.textContent = login ? "登录后即可保存你的对话记录" : "创建一个账号，开始保存对话记录";
  authSubmit.textContent = login ? "登录" : "注册";
  authSwitch.textContent = login ? "没有账号？去注册" : "已有账号？去登录";
  authPass.autocomplete = login ? "current-password" : "new-password";
  authErr.textContent = "";
}

authSwitch.onclick = () => setAuthMode(authMode === "login" ? "register" : "login");

authForm.onsubmit = async (e) => {
  e.preventDefault();
  const username = authUser.value.trim();
  const password = authPass.value;
  authErr.textContent = "";
  if (!username || !password) { authErr.textContent = "请输入用户名和密码"; return; }
  authSubmit.disabled = true;
  try {
    const data = await api("/api/" + (authMode === "login" ? "login" : "register"), {
      method: "POST",
      body: JSON.stringify({ username, password }),
    });
    token = data.token;
    localStorage.setItem("token", token);
    currentUser = data.user;
    authPass.value = "";
    await enterApp();
  } catch (err) {
    authErr.textContent = err.message;
  } finally {
    authSubmit.disabled = false;
  }
};

function logout() {
  token = "";
  currentUser = null;
  localStorage.removeItem("token");
  if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} ws = null; }
  conversations = [];
  currentConv = null;
  chat.innerHTML = "";
  appEl.style.display = "none";
  setAuthMode("login");
  authEl.style.display = "flex";
}
logoutBtn.onclick = logout;

/* ============================================================
- 进入应用 / 会话列表
- ============================================================ */

async function enterApp() {
  authEl.style.display = "none";
  appEl.style.display = "flex";
  userNameEl.textContent = currentUser.display_name || currentUser.username;
  await loadConversations();
  if (conversations.length) openConversation(conversations[0]);
  else await newConversation();
}

async function loadConversations() {
  conversations = await api("/api/conversations");
  renderConversations();
}

function renderConversations() {
  convList.innerHTML = "";
  if (!conversations.length) {
    const tip = document.createElement("div");
    tip.style.cssText = "padding:12px;color:var(--text-muted);font-size:12px;text-align:center";
    tip.textContent = "暂无历史对话";
    convList.appendChild(tip);
    return;
  }
  conversations.forEach(c => {
    const el = document.createElement("div");
    el.className = "conv" + (currentConv && currentConv.id === c.id ? " active" : "");
    el.title = c.title || "新会话";

    const span = document.createElement("span");
    span.className = "title";
    span.textContent = c.title || "新会话";

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.title = "删除会话";
    del.onclick = (ev) => { ev.stopPropagation(); removeConversation(c); };

    el.appendChild(span);
    el.appendChild(del);
    el.onclick = () => openConversation(c);
    el.ondblclick = () => renameConversation(c);
    convList.appendChild(el);
  });
}

async function newConversation() {
  const conv = await api("/api/conversations", { method: "POST" });
  conversations.unshift(conv);
  renderConversations();
  openConversation(conv);
}
newChatBtn.onclick = () => { newConversation().catch(e => alert(e.message)); };

async function removeConversation(c) {
  if (!confirm('删除会话「' + (c.title || "新会话") + '」？此操作不可恢复。')) return;
  try {
    await api("/api/conversations/" + c.id, { method: "DELETE" });
  } catch (e) { alert(e.message); return; }
  conversations = conversations.filter(x => x.id !== c.id);
  if (currentConv && currentConv.id === c.id) {
    currentConv = null;
    if (conversations.length) openConversation(conversations[0]);
    else await newConversation();
  } else {
    renderConversations();
  }
}

async function renameConversation(c) {
  const t = prompt("重命名会话", c.title || "新会话");
  if (t == null) return;
  const title = t.trim();
  if (!title) return;
  try {
    const updated = await api("/api/conversations/" + c.id, {
      method: "PATCH", body: JSON.stringify({ title }),
    });
    Object.assign(c, updated);
    if (currentConv && currentConv.id === c.id) currentConv = c;
    renderConversations();
  } catch (e) { alert(e.message); }
}

function openConversation(conv) {
  currentConv = conv;
  renderConversations();
  chat.innerHTML = "";
  retrieveNotice = null;
  interruptPanel.style.display = "none";
  interruptPanel.innerHTML = "";
  connectWS(conv.thread_id);
}

/* ============================================================
- WebSocket
- ============================================================ */

function connectWS(threadId) {
  const seq = ++connectSeq;
  if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const url = `${proto}://${location.host}/ws/${encodeURIComponent(threadId)}?token=${encodeURIComponent(token)}`;
  ws = new WebSocket(url);

  ws.onopen = () => { if (seq === connectSeq) setBusy(false); };

  ws.onclose = (evt) => {
    if (seq !== connectSeq) return;
    if (evt.code === 4401 || evt.code === 4404) {
      logout();
      alert(evt.code === 4401 ? "登录已失效，请重新登录" : "会话不存在或无权访问");
      return;
    }
    append("system", "连接断开，重连中...");
    setTimeout(() => { if (seq === connectSeq) connectWS(threadId); }, 2000);
  };

  ws.onmessage = (evt) => {
    if (seq !== connectSeq) return;
    let d;
    try { d = JSON.parse(evt.data); } catch (e) { return; }

    switch (d.type) {
      case "replay_start":
        // 重连或切换会话时，清空当前视图后按数据库顺序重建，避免重复
        chat.innerHTML = "";
        retrieveNotice = null;
        break;

      case "replay_end":
        // 回放结束：若上次执行在检索中途中断，避免残留转动中的 loading
        if (retrieveNotice && retrieveNotice.isConnected) {
          retrieveNotice.querySelectorAll(".spinner").forEach(s => s.remove());
        }
        break;

      case "user":
        retrieveNotice = null;
        append("user", d.content);
        break;

      case "update": {
        const m = d.message || {};
        const animate = m.role === "assistant" && !d.replay;
        append(m.role, m.content, m.tool_calls, { animate });
        break;
      }

      case "conversation": {
        const c = d.conversation;
        if (!c) break;
        const idx = conversations.findIndex(x => x.id === c.id);
        if (idx >= 0) conversations[idx] = c; else conversations.unshift(c);
        conversations.sort((a, b) => String(b.updated_at || "").localeCompare(String(a.updated_at || "")));
        if (currentConv && currentConv.id === c.id) currentConv = c;
        renderConversations();
        break;
      }

      case "route":
        showRoute(d);
        break;

      case "retrieve":
        showRetrieve(d);
        break;

      case "retrieve_stage":
        showRetrieveStage(d);
        break;

      case "dispatch":
        showDispatch(d);
        break;

      case "interrupt":
        showInterrupt(d.payload);
        break;

      case "interrupt_record":
        showInterruptRecord(d.payload);
        break;

      case "review_result":
        showReviewResult(d.payload);
        break;

      case "done":
        renderChain.then(() => setBusy(false));
        break;

      case "error":
        append("error", d.content);
        renderChain.then(() => setBusy(false));
        break;
    }
  };
}

/* ============================================================
- 渲染队列
- ============================================================ */

let renderChain = Promise.resolve();
function enqueue(task) {
  renderChain = renderChain.then(task).catch(err => console.error(err));
  return renderChain;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

function typeInto(el, text) {
  return new Promise(resolve => {
    const total = text.length;
    if (!total) { el.classList.remove("typing"); resolve(); return; }
    const duration = Math.min(1400, Math.max(240, total * 10));
    const t0 = performance.now();
    const frame = (now) => {
      const p = Math.min(1, (now - t0) / duration);
      el.textContent = text.slice(0, Math.floor(p * total));
      scrollBottom();
      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        el.textContent = text;
        el.classList.remove("typing");
        scrollBottom();
        resolve();
      }
    };
    requestAnimationFrame(frame);
  });
}

function append(role, content, toolCalls, opts) {
  opts = opts || {};
  const tip = document.getElementById("empty-tip");
  if (tip) tip.remove();

  const el = document.createElement("div");
  el.className = "msg " + role;

  let text = content == null ? "" : String(content);
  if (toolCalls && toolCalls.length) {
    text += "\n🛠️ 工具: " + toolCalls.map(t => t.name).join(", ");
  }

  if (opts.animate) {
    el.classList.add("typing");
    chat.appendChild(el);
    scrollBottom();
    return enqueue(() => typeInto(el, text));
  }

  el.textContent = text;
  chat.appendChild(el);
  scrollBottom();
  return Promise.resolve();
}

/* ============================================================
- 节点事件提示条
- ============================================================ */

function notice(html, cls) {
  const el = document.createElement("div");
  el.className = "notice " + (cls || "");
  el.innerHTML = html;
  chat.appendChild(el);
  scrollBottom();
}

function showRoute(d) {
  const map = { animal: "陆生动物数据分析", plant: "陆生植物数据分析", chat: "一般问答" };
  const reason = d.reason ? ` <span class="sub">（${escapeHtml(d.reason)}）</span>` : "";
  notice(`🧭 需求判断：<b>${map[d.route] || escapeHtml(d.route)}</b>${reason}`, "route");
}

function showRetrieve(d) {
  const html =
    `🔍 查询数据库：<b>${escapeHtml(d.label || d.kb)}</b>` +
    ` <span class="sub">[${escapeHtml(d.kb)}]</span>` +
    ` — 检索到 <b>${d.count}</b> 条相关资料`;
  if (retrieveNotice && retrieveNotice.isConnected) {
    retrieveNotice.innerHTML = html;
    retrieveNotice = null;
  } else {
    notice(html, "retrieve");
  }
  scrollBottom();
}

const RETRIEVE_STAGE_TEXT = {
  hybrid: "正在混合检索（语义向量 + 关键词 BM25）…",
  rrf: "正在 RRF 融合重排…",
  rerank: "正在 Cross-Encoder 精排…",
  empty: "该知识库暂无可检索内容",
};
let retrieveNotice = null;

function showRetrieveStage(d) {
  const label = escapeHtml(d.label || d.kb);
  const kbTag = `<span class="sub">[${escapeHtml(d.kb)}]</span>`;
  let extra = "";
  if (d.stage === "rrf" && d.candidates != null) {
    extra = ` <span class="sub">（融合候选 ${d.candidates} 条）</span>`;
  } else if (d.stage === "rerank" && d.candidates != null) {
    extra = ` <span class="sub">（对 ${d.candidates} 条候选打分）</span>`;
  }
  const stageText = RETRIEVE_STAGE_TEXT[d.stage] || `处理中（${escapeHtml(d.stage)}）…`;
  const spinner = d.stage === "empty" ? "" : `<span class="spinner"></span>`;
  const html = `${spinner}🗂️ 检索数据库：<b>${label}</b> ${kbTag} — ${stageText}${extra}`;

  if (retrieveNotice && retrieveNotice.isConnected) {
    retrieveNotice.innerHTML = html;
  } else {
    retrieveNotice = document.createElement("div");
    retrieveNotice.className = "notice retrieve";
    retrieveNotice.innerHTML = html;
    chat.appendChild(retrieveNotice);
  }
  scrollBottom();
}

function showDispatch(d) {
  const task = (d.task || "").replace(/\s+/g, " ").slice(0, 120);
  notice(
    `🔀 任务已分配至子代理 <b>${escapeHtml(d.agent)}</b>（${escapeHtml(d.label)}）` +
    `<br><span class="sub">任务：${escapeHtml(task)}${(d.task || "").length > 120 ? "…" : ""}</span>`,
    "dispatch"
  );
}

const INTERRUPT_TYPE_TEXT = {
  missing_required_params: "技能缺少必填参数",
  execution_error: "技能执行出错",
  review: "工作流中间审核",
};

function showInterruptRecord(payloads) {
  (payloads || []).forEach(p => {
    const t = (p && p.type) || "unknown";
    const label = INTERRUPT_TYPE_TEXT[t] || escapeHtml(t);
    notice(`🖐️ 人工审核：<b>${escapeHtml(label)}</b>`, "review");
  });
}

const REVIEW_ACTION_TEXT = {
  provide: "已提供参数",
  default: "已改用默认参数",
  continue: "审核通过，继续执行",
  retry: "已请求重新执行",
  abort: "已终止执行",
};

function showReviewResult(payload) {
  const value = (payload && payload.value) || payload || {};
  const itype = payload && payload.interrupt_type;
  const typeLabel = itype ? (INTERRUPT_TYPE_TEXT[itype] || escapeHtml(itype)) : "人工审核";
  const action = value.action || (value.approved ? "continue" : "");
  const label = REVIEW_ACTION_TEXT[action] || escapeHtml(action || "已提交");

  let extra = "";
  if (action === "provide" && value.params && Object.keys(value.params).length) {
    extra += `<br><span class="sub">参数：${escapeHtml(JSON.stringify(value.params))}</span>`;
  }
  if (action === "retry") {
    const fb = (value.feedback || "").trim();
    if (fb) extra += `<br><span class="sub">修改建议：${escapeHtml(fb)}</span>`;
  }
  if (value.target_step !== undefined && value.target_step !== null && value.target_step !== "") {
    extra += `<br><span class="sub">重新执行起点：步骤 ${escapeHtml(value.target_step)}</span>`;
  }

  notice(`✅ 人工审核结果（${escapeHtml(typeLabel)}）：<b>${label}</b>${extra}`, "review");
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  input.disabled = busy;
  if (!busy) input.focus();
}

/* ============================================================
- 人工确认面板
- ============================================================ */

function showInterrupt(payloads) {
  interruptPanel.style.display = "block";
  interruptPanel.innerHTML = "";
  payloads.forEach(p => {
    const box = document.createElement("div");
    const type = p.type || "unknown";
    let html = `<div style="font-weight:600;margin-bottom:8px;color:#92400e">⚠️ 需要人工确认：${type}</div>`;

    if (type === "missing_required_params") {
      html += `<div style="font-size:13px;margin-bottom:6px">技能：${p.skill || ""}</div>`;
      (p.missing_params || []).forEach(item => {
        const name = item.name || item;
        const desc = item.description || "";
        html += `<div style="font-size:13px;margin:4px 0">- ${name}：${desc}
          <input type="text" data-param="${name}" placeholder="留空=脚本默认"/></div>`;
      });
      html += `<div style="margin-top:8px">
                 <button id="ip-provide">提供参数</button>
                 <button id="ip-default" style="background:#64748b">使用默认参数</button>
               </div>`;
    } else if (type === "execution_error") {
      const retryable = p.retryable_steps || [];
      html += `<div style="font-size:13px;margin-bottom:4px">错误：${escapeHtml(p.error || "")}</div>`;
      if (retryable.length) {
        html += `<div style="margin:6px 0;font-size:13px">选择重新执行起点：
          <select id="ip-target-step">
            <option value="">默认（当前失败步骤）</option>
            ${retryable.map(s => `<option value="${escapeHtml(s.step_num)}">步骤 ${escapeHtml(s.step_num)}：${escapeHtml(s.skill_name || s.skill_id || "")}</option>`).join("")}
          </select></div>`;
      }
      html += `<div style="margin-top:6px"><input type="text" id="ip-feedback" placeholder="修改建议（可选）" style="width:60%"/></div>
               <div style="margin-top:8px">
                 <button id="ip-retry" style="background:#dc2626">重试</button>
                 <button id="ip-abort" style="background:#64748b">终止</button>
               </div>`;
    } else {
      const retryable = p.retryable_steps
        || (p.content_structured && p.content_structured.retryable_steps) || [];
      const content = p.content_text || JSON.stringify(p, null, 2);
      html += `<pre>${escapeHtml(content)}</pre>`;
      if (retryable.length) {
        html += `<div style="margin:6px 0;font-size:13px">选择重新执行起点：
          <select id="ip-target-step">
            <option value="">默认（上一步骤）</option>
            ${retryable.map(s => `<option value="${escapeHtml(s.step_num)}">步骤 ${escapeHtml(s.step_num)}：${escapeHtml(s.skill_name || s.skill_id || "")}</option>`).join("")}
          </select></div>`;
      }
      html += `<div style="margin-top:6px"><input type="text" id="ip-feedback" placeholder="修改建议（可选）" style="width:60%"/></div>
               <div style="margin-top:8px">
                 <button id="ip-approve" style="background:#10b981">通过</button>
                 <button id="ip-retry">重新执行</button>
                 <button id="ip-abort" style="background:#64748b">终止</button>
               </div>`;
    }
    box.innerHTML = html;
    interruptPanel.appendChild(box);

    box.querySelectorAll("button").forEach(btn => {
      btn.onclick = () => {
        let resume = {};
        if (btn.id === "ip-provide") {
          const params = {};
          box.querySelectorAll("input[data-param]").forEach(i => {
            if (i.value.trim()) params[i.dataset.param] = i.value.trim();
          });
          resume = { action: "provide", params };
        } else if (btn.id === "ip-default") {
          resume = { action: "default" };
        } else if (btn.id === "ip-approve") {
          resume = { approved: true, action: "continue" };
        } else if (btn.id === "ip-retry") {
          const fb = box.querySelector("#ip-feedback");
          const sel = box.querySelector("#ip-target-step");
          resume = { approved: false, action: "retry", feedback: fb ? fb.value : "" };
          if (sel && sel.value) resume.target_step = Number(sel.value);
        } else if (btn.id === "ip-abort") {
          resume = { approved: false, action: "abort" };
        }
        interruptPanel.style.display = "none";
        interruptPanel.innerHTML = "";
        setBusy(true);
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ kind: "resume", value: resume }));
        }
      };
    });
  });
}

/* ============================================================
- 发送消息
- ============================================================ */

form.onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  input.value = "";
  input.style.height = 'auto';
  setBusy(true);
  ws.send(JSON.stringify({ kind: "message", text }));
};

/* ============================================================
- 启动
- ============================================================ */

(async function bootstrap() {
  setAuthMode("login");
  if (token) {
    try {
      currentUser = await api("/api/me");
      await enterApp();
      return;
    } catch (e) {
      token = "";
      localStorage.removeItem("token");
    }
  }
  authEl.style.display = "flex";
})();
</script>
